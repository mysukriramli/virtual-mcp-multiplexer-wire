name: Virtual MCP Multiplexer Engine

on:
  schedule:
    - cron: '33 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mcp-router-compile
  cancel-in-progress: true

jobs:
  route-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/tool_mesh.db
          key: tool-mesh-v1-db-${{ github.run_id }}
          restore-keys: |
            tool-mesh-v1-db-

      - name: Execute Router & Benchmark Engine
        run: python router_engine.py

      - name: Commit Ledger and Parquet Catalogs
        run: |
          git config user.name "mcp-router-bot[bot]"
          git config user.email "mcp-router-bot@users.noreply.github.com"

          # Stage ledger, parquet, and public edge payloads
          git add ledger/ data/ public/

          if git diff --staged --quiet; then
            echo "No tool mutations or catalog updates to commit."
          else
            git commit -m "chore(mcp): update tool schemas and routing benchmarks [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
